# Pocket New York drawn with wgpu: in a browser tab over WebGPU (wasm32), and on the machine that builds it (Metal),
# where frames go to files.
#
# What moves is crates/ny-sim, the flow crates/ny-interface, what a frame works out on the processor crates/ny-frame
# and what it draws crates/ny-view, as the PS Vita links them. The pack is the PS Vita's (`cargo run --release -p
# ny-cook`), read as it is. Everything that is not this game's is PocketJS's browser kernel
# (vendor/pocketjs/devices/web/pocket-web-wgpu): the GPU device and its screens, the interface's overlay pass, the
# pack's reads, the page and its player.
#
#   bun tools/web.ts build | serve | dist | shot | check     (from the repository root)

[package]
name = "ny-wgpu"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Pocket New York's wgpu renderer: the PS Vita's pack and frame in a browser tab and on the build machine"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "ny-shot"
path = "src/bin/shot.rs"

[dependencies]
ny-pack = { path = "../crates/ny-pack" }
ny-sim = { path = "../crates/ny-sim" }
ny-view = { path = "../crates/ny-view" }
ny-frame = { path = "../crates/ny-frame" }
ny-interface = { path = "../crates/ny-interface" }
pocket-web-wgpu = { path = "../vendor/pocketjs/devices/web/pocket-web-wgpu" }
serde_json = "1"
bytemuck = { version = "1", features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The command line tool that writes the JavaScript side must be this version (tools/web.ts checks).
wasm-bindgen = "=0.2.126"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "console"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
png = "0.17"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1

[workspace]
resolver = "2"
