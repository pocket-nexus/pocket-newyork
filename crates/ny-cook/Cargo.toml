[package]
name = "ny-cook"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Scene compiler of Pocket New York: lowers the SceneIR the reference exports to a device pack"

[dependencies]
ny-pack = { path = "../ny-pack" }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
texpresso = { version = "2", features = ["rayon"] }
image = { version = "0.25", default-features = false, features = ["png"] }
meshopt = "0.6"
